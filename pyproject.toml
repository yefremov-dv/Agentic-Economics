[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-economics"
version = "0.1.0"
description = "Демо агентной экономики: оркестратор, аукцион агентов, виртуальные кошельки"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-gigachat>=0.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentic-economics = "agentic_economics.cli:app"

[tool.setuptools.packages.find]
include = ["agentic_economics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
